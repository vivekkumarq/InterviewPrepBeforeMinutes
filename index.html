<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InterviewPrepBeforeMinutes — Last Minute Interview Preparation</title>
<meta name="description" content="Last-minute interview preparation hub: Java, Spring Boot, Microservices, Kafka, SQL, Docker, Kubernetes, Angular, React, DSA and more — with beginner and advanced questions, answers, diagrams and code." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="progress-bar" id="scrollProgress"></div>

<header class="topbar">
  <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="brand" href="#/">
    <span class="brand-mark">⚡</span>
    <span class="brand-text">
      <strong>InterviewPrep<em>BeforeMinutes</em></strong>
      <small>Last minute preparation, done right</small>
    </span>
  </a>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="globalSearch" placeholder="Search 500+ questions…  (press /)" autocomplete="off" spellcheck="false" />
    <kbd class="kbd-hint">/</kbd>
    <div class="search-results" id="searchResults" hidden></div>
  </div>

  <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
    <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
  </button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-head">
        <span>Tech Stacks</span>
        <span class="pill" id="totalCount">—</span>
      </div>
      <nav id="navTree" class="nav-tree"><!-- built by app.js --></nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" id="resetProgress">Reset progress</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <div id="view" class="view"><!-- rendered --></div>
    <footer class="site-foot">
      <p>Built by <a href="https://github.com/vivekkumarq" target="_blank" rel="noopener">Vivek Kumar</a> · Java · Spring Boot · Microservices</p>
      <p class="muted">Revise smart. Walk in confident.</p>
    </footer>
  </main>
</div>

<button class="fab" id="toTop" aria-label="Back to top" hidden>
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="js/topics.js"></script>
<script src="js/app.js"></script>
</body>
</html>
