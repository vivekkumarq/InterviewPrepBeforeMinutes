<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InterviewPrepBeforeMinutes — Last Minute Interview Preparation</title>
<meta name="description" content="Last-minute interview preparation hub: Java, Spring Boot, Microservices, Kafka, SQL, Docker, Kubernetes, Angular, React, DSA and more — with beginner and advanced questions, answers, diagrams and code." />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<meta name="theme-color" content="#0b0e14" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="InterviewPrep" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="progress-bar" id="scrollProgress"></div>

<header class="topbar">
  <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="brand" href="#/">
    <span class="brand-mark">⚡</span>
    <span class="brand-text">
      <strong>InterviewPrep<em>BeforeMinutes</em></strong>
      <small>Last minute preparation, done right</small>
    </span>
  </a>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="globalSearch" placeholder="Search every question…  (Ctrl K)" autocomplete="off" spellcheck="false" />
    <kbd class="kbd-hint">/</kbd>
    <div class="search-results" id="searchResults" hidden></div>
  </div>

  <div class="type-wrap">
    <button class="icon-btn type-btn" id="fontToggle" aria-label="Appearance" aria-expanded="false" aria-controls="fontPanel" title="Theme, typeface and text size">
      <svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg>
      <span class="font-name" id="fontName">Inter</span>
    </button>
  </div>

  <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
    <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
  </button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-head">
        <span>Tech Stacks</span>
        <span class="pill" id="totalCount">—</span>
      </div>
      <nav id="navTree" class="nav-tree"><!-- built by app.js --></nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" id="resetProgress">Reset progress</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <div id="view" class="view"><!-- rendered --></div>
    <footer class="site-foot">
      <p>Built by <a href="https://github.com/vivekkumarq" target="_blank" rel="noopener">Vivek Kumar</a> · Java · Spring Boot · Microservices</p>
      <p class="muted">Revise smart. Walk in confident.</p>
    </footer>
  </main>
</div>

<!-- Phone navigation: the most-used destinations within thumb reach. -->
<nav class="bottom-nav" aria-label="Quick navigation">
  <a class="bn-item" data-view="home" href="#/"><span aria-hidden="true">🏠</span><b>Home</b></a>
  <button class="bn-item" data-action="menu" type="button"><span aria-hidden="true">📚</span><b>Topics</b></button>
  <button class="bn-item" data-action="search" type="button"><span aria-hidden="true">🔍</span><b>Search</b></button>
  <a class="bn-item" data-view="saved" href="#/saved"><span aria-hidden="true">⭐</span><b>Saved</b><i class="saved-count"></i></a>
  <button class="bn-item" data-action="surprise" type="button"><span aria-hidden="true">🎲</span><b>Surprise</b></button>
</nav>

<button class="fab" id="toTop" aria-label="Back to top" hidden>
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<!-- Kept OUTSIDE the header: .topbar has a backdrop-filter, which makes it the
     containing block for any position:fixed descendant — that would anchor the
     mobile bottom sheet to the header instead of the viewport. -->
<div class="sheet-scrim" id="fontScrim" hidden></div>
<div class="font-panel" id="fontPanel" role="dialog" aria-label="Theme, typeface and text size" hidden><!-- built by app.js --></div>

<script src="js/topics.js"></script>
<script src="js/coding.js"></script>
<script src="js/motifs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
